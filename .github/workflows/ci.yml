name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install core package
        run: python -m pip install -e . pytest
      - name: Verify package and contracts
        run: |
          python -m pip check
          python -m newsvlm_analysis --version
          python -m compileall -q src scripts/pipelines/run_stack_contract_canary.py
          pytest -q tests --ignore=tests/integration

  scientific:
    name: Scientific workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install scientific stack
        run: python -m pip install -r requirements.txt pytest
      - name: Run scientific integration tests
        run: |
          python -m pip check
          pytest -q tests/integration
